name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.17.1'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run schemas
      - run: git diff --exit-code -- schemas tests/fixtures/canonicalization.json
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: reqman-${{ matrix.os }}
          path: release-artifacts/
          retention-days: 7
